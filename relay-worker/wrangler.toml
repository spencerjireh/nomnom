name = "nomnom-relay"
main = "src/worker.ts"
compatibility_date = "2026-05-01"

# Custom domain. Requires the zone (spencerjireh.com) to be on Cloudflare;
# Wrangler provisions the DNS record + SSL cert on deploy.
routes = [
  { pattern = "relay.spencerjireh.com", custom_domain = true },
]

# R2 holds ciphertext bodies only (feeds/<id>/slots/<slot_id>). The index that
# says which bodies exist lives in the per-feed Durable Object below; nothing
# ever lists the bucket. Do NOT attach a lifecycle rule: the DO's alarm owns
# expiry, and a bucket rule would delete blobs out from under live rows.
# Create with: npx wrangler r2 bucket create nomnom-relay
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nomnom-relay"

# One SQLite-backed Durable Object per feed (idFromName). It holds the post
# index (seq cursor), the member roster, in-flight long-poll waiters for the
# CLI, hibernatable WebSockets for the web client, and a daily alarm that
# enforces the 30-day retention window.
[[durable_objects.bindings]]
name = "FEED"
class_name = "Feed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedNotifier"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Feed"]
deleted_classes = ["FeedNotifier"]

# HMAC secret is set out-of-band. The fastest path is to let `nomnom relay init`
# generate it for you — it prints the exact `wrangler secret put` and
# `wrangler deploy` commands. Or generate one yourself, e.g.
#   python3 -c 'import secrets; print(secrets.token_urlsafe(9))' \
#     | npx wrangler secret put NOMNOM_HMAC_SECRET
#
# Do not check the secret into this file.
